name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', 'lts/*', 'node']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec biome ci .
      - run: node scripts/check-forbidden.ts
      - run: pnpm build # the CLI end-to-end test runs dist/bin.js under plain Node
      - run: pnpm test

  bench:
    name: benchmarks (query budgets)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Query budgets fail the job; timings are uploaded for trend tracking (not asserted: shared runners are noisy).
      - run: pnpm bench
        env:
          BENCH_ORDERS: '5000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: benchmarks/results.json
